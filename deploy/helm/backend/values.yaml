replicaCount: 1

image:
  repository: localhost:5001/awsdemo-backend
  tag: "c2df23e"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  host: api.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70

dbSecretName: awsdemo-db-credentials
jwtSecretName: awsdemo-jwt-secret
configMapName: awsdemo-backend-config
