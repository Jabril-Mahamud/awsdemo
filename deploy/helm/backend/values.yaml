replicaCount: 1

image:
  repository: ghcr.io/jabril-mahamud/awsdemo-backend
  tag: "7e4b04a"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  host: api.3.252.78.1.nip.io

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70

dbSecretName: awsdemo-db-credentials
jwtSecretName: awsdemo-jwt-secret
configMapName: awsdemo-backend-config
