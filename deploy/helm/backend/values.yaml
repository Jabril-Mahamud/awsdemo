replicaCount: 1

image:
  repository: awsdemo-backend
  tag: "12a290b"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  host: api.52.30.45.243.nip.io

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70

dbSecretName: awsdemo-db-credentials
jwtSecretName: awsdemo-jwt-secret
configMapName: awsdemo-backend-config
