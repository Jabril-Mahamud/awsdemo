apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awsdemo-database
  namespace: argocd
spec:
  destination:
    namespace: awsdemo
    server: https://kubernetes.default.svc
  project: awsdemo
  source:
    path: infrastructure/claims
    repoURL: https://github.com/Jabril-Mahamud/awsdemo.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
