apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awsdemo-frontend
  namespace: argocd
spec:
  destination:
    namespace: awsdemo
    server: https://kubernetes.default.svc
  project: awsdemo
  source:
    path: deploy/helm/frontend
    repoURL: git://git-server.default.svc/repo.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
