apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awsdemo-backend
  namespace: argocd
spec:
  project: awsdemo
  source:
    repoURL: https://github.com/OWNER/awsdemo.git
    targetRevision: HEAD
    path: deploy/helm/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: awsdemo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
